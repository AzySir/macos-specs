name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must match vX.Y.Z — got '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Smoke-test app bundle
        run: |
          test -x build/MacOSSpecs.app/Contents/MacOS/MacOSSpecs
          /usr/bin/codesign --verify --verbose=2 build/MacOSSpecs.app
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" build/MacOSSpecs.app/Contents/Info.plist

      - name: Zip app
        working-directory: build
        run: zip -yr MacOSSpecs.zip MacOSSpecs.app

      - name: Compute SHA-256
        id: sha
        working-directory: build
        run: |
          CHECKSUM="$(shasum -a 256 MacOSSpecs.zip | awk '{print $1}')"
          echo "sha256=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "$CHECKSUM  MacOSSpecs.zip" > MacOSSpecs.zip.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MacOSSpecs.zip
            build/MacOSSpecs.zip.sha256
            scripts/install.sh
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/AzySir/macos-specs/main/scripts/install.sh | bash
            ```

            This clones to a temp dir, builds from source, installs `MacOSSpecs.app`
            to `/Applications`, drops a CLI launcher at `/usr/local/bin/macos-specs`,
            enables launch-at-login, and removes the temp dir.

            ## Checksums

            ```
            ${{ steps.sha.outputs.sha256 }}  MacOSSpecs.zip
            ```
