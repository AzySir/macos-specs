name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Mondays at 07:00 UTC — catches rule updates without
    # waiting on repo activity.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab
  actions: read            # required for private repos to read workflow metadata

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Swift
    # Swift extraction runs on macOS so the analyzer can observe the real
    # toolchain build. ubuntu is not used here even though CodeQL supports it,
    # because our build targets AppKit/SwiftUI and needs Xcode.
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          # security-extended adds higher-signal security queries beyond the
          # default set; drop to `default` if scan time becomes an issue.
          queries: security-extended

      # Manual build: CodeQL's autobuilder works for plain SwiftPM packages,
      # but pinning the command keeps extraction deterministic and mirrors
      # how release.yml builds.
      - name: Build Swift package
        run: swift build -c debug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
